<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14170f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Front Armor: low-poly tank battles. Steer, pick your targets and upgrades, and crush the enemy stronghold. Free to play in your browser.">
<meta property="og:title" content="Front Armor">
<meta property="og:description" content="Read the intel, pick the right tank, and win by driving well.">
<meta property="og:image" content="https://front-armor.koraykural.com/TemplateData/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<title>Front Armor</title>
<link rel="icon" type="image/png" href="TemplateData/favicon.png">
<link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="TemplateData/splash.webp" media="(max-aspect-ratio: 5/4)">
<link rel="preload" as="image" href="TemplateData/splash-wide.webp" media="(min-aspect-ratio: 5/4)">
<style>
  :root { --bg:#14170f; --fg:#ebe8d5; --muted:#a2a48c; --accent:#e2b548; --line:#414b36; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); overscroll-behavior: none; }
  body { position: fixed; inset: 0; font-family: "Chakra Petch", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: var(--bg); touch-action: none; outline: none; }

  /* loader: splash art + logo + progress, fades out when the game is up (the in-game splash takes over with the same art) */
  #loader { position: absolute; inset: 0; z-index: 2; display: grid; overflow: hidden; background: var(--bg); transition: opacity .5s ease; }
  #loader.gone { opacity: 0; pointer-events: none; }
  .art { position: absolute; inset: 0; background: url("TemplateData/splash.webp") center 62% / cover no-repeat; transform: scale(1.04); animation: drift 18s ease-in-out infinite alternate; }
  .blur { display: none; position: absolute; inset: -40px; background: url("TemplateData/splash.webp") center 60% / cover no-repeat; filter: blur(28px) brightness(.45) saturate(1.1); }
  .shade { position: absolute; inset: 0; background:
      radial-gradient(120% 80% at 50% 55%, transparent 30%, rgba(10,12,8,.55) 75%, rgba(10,12,8,.9) 100%),
      linear-gradient(to bottom, rgba(20,23,15,.85) 0%, rgba(20,23,15,0) 30%, rgba(20,23,15,0) 55%, rgba(20,23,15,.95) 88%); }
  @keyframes drift { from { transform: scale(1.04) translate3d(0,0,0); } to { transform: scale(1.1) translate3d(-1.5%, -1%, 0); } }

  .brand { position: relative; align-self: start; justify-self: center; text-align: center; padding: max(28px, env(safe-area-inset-top)) 20px 0; }
  .brand img { width: 84px; height: 84px; border-radius: 22%; box-shadow: 0 10px 30px rgba(0,0,0,.55), 0 0 0 1px rgba(235,232,213,.12); }
  h1 { margin: 14px 0 4px; font: 400 clamp(34px, 7vw, 56px)/1 "Black Ops One", system-ui; letter-spacing: .04em; text-shadow: 0 3px 0 rgba(0,0,0,.45), 0 8px 30px rgba(0,0,0,.6); }

  .dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 20px max(22px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .status { font-weight: 700; font-size: 11px; letter-spacing: .3em; color: var(--muted); }
  .track { width: min(320px, 78vw); height: 8px; border-radius: 4px; background: rgba(0,0,0,.5); box-shadow: inset 0 0 0 1px rgba(235,232,213,.08); overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, #c99a33, var(--accent) 60%, #f3d27e); box-shadow: 0 0 12px rgba(226,181,72,.6); transition: width .25s ease; }
  .links { display: flex; gap: 18px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .links a { color: inherit; text-decoration: none; border-bottom: 1px solid transparent; }
  .links a:hover { color: var(--fg); border-color: var(--line); }

  .err { display: none; max-width: 360px; padding: 12px 16px; border-radius: 8px; background: rgba(20,23,15,.92); border: 1px solid #d4613f; color: var(--fg); font-size: 14px; text-align: center; }
  .err.on { display: block; }

  /* landscape: brand on the left over a darkened side, art fills the rest */
  @media (min-aspect-ratio: 5/4) {
    /* wide key art: hero tank on the right, calm dunes on the left under the brand */
    .art { background-image: url("TemplateData/splash-wide.webp"); background-position: 70% 50%; }
    .shade { background:
        linear-gradient(90deg, rgba(20,23,15,.9) 0%, rgba(20,23,15,.55) 35%, rgba(20,23,15,0) 60%),
        linear-gradient(to bottom, rgba(20,23,15,.5) 0%, rgba(20,23,15,0) 25%, rgba(20,23,15,0) 70%, rgba(20,23,15,.85) 100%); }
    .brand { align-self: center; justify-self: start; text-align: left; padding: 0 0 0 max(6vw, env(safe-area-inset-left)); }
    .brand img { width: 96px; height: 96px; }
    h1 { font-size: clamp(40px, 6vw, 76px); }
    .dock { left: max(6vw, env(safe-area-inset-left)); right: auto; align-items: flex-start; bottom: max(7vh, env(safe-area-inset-bottom)); padding: 0; }
  }
  @media (min-aspect-ratio: 5/4) and (max-height: 420px) {
    .brand img { width: 60px; height: 60px; } h1 { font-size: 36px; margin-top: 8px; }
  }
  @media (prefers-reduced-motion: reduce) { .art { animation: none; } }
</style>
</head>
<body>
<canvas id="game" tabindex="-1"></canvas>
<div id="loader">
  <div class="blur"></div><div class="art"></div><div class="shade"></div>
  <div class="brand">
    <img src="TemplateData/icon.webp" alt="Front Armor">
    <h1>FRONT ARMOR</h1>
  </div>
  <div class="dock">
    <div class="err" id="err"></div>
    <div class="status" id="status">LOADING</div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <nav class="links"><a href="https://koraykural.github.io/front-armor-site/support.html" target="_blank" rel="noopener">Support</a><a href="https://koraykural.github.io/front-armor-site/privacy.html" target="_blank" rel="noopener">Privacy</a><a href="https://koraykural.com" target="_blank" rel="noopener">koraykural.com</a></nav>
  </div>
</div>
<script>
  var canvas = document.getElementById("game"), fill = document.getElementById("fill"), statusEl = document.getElementById("status"), err = document.getElementById("err");
  function showErr(msg) { err.textContent = msg; err.classList.add("on"); }
  var buildUrl = "Build";
  var config = {
    arguments: [],
    dataUrl: buildUrl + "/527068b59abb920d5d2cb525cf569ecc.data.unityweb",
    frameworkUrl: buildUrl + "/4f1da9e1fb6ee194bd3475b7b1aed300.framework.js.unityweb",
    codeUrl: buildUrl + "/551e9df8a4be47bb35ca60e906e3a51d.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Front Armor",
    productName: "Front Armor",
    productVersion: "1.0",
    // cap the render resolution: phones report DPR 3, which costs a lot of fill rate for little gain
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    showBanner: function (msg, type) { if (type === "error") showErr(msg); else console.warn(msg); },
  };
  // no page zoom / scroll gestures over the game
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("touchmove", function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  var script = document.createElement("script");
  script.src = buildUrl + "/6f8bf6423ca7b76d797a628640a835fd.loader.js";
  script.onload = function () {
    // one bar: download is the first 80%, the game's own boot (models, audio, menu) the last 20%. The game calls faReady when its menu is up.
    var shown = 0;
    function bar(p) { p = Math.max(shown, Math.min(1, p)); shown = p; fill.style.width = (p * 100).toFixed(1) + "%"; statusEl.textContent = "LOADING  " + Math.round(p * 100) + "%"; }
    window.faBoot = function (p) { bar(.8 + .2 * p); };
    window.faReady = function () {
      bar(1); var l = document.getElementById("loader"); if (!l) return;
      l.classList.add("gone"); canvas.focus(); setTimeout(function () { l.remove(); }, 600);
    };
    createUnityInstance(canvas, config, function (p) { bar(.8 * p); })
      .then(function () { setTimeout(function () { if (shown < .8) bar(.8); }, 0); setTimeout(window.faReady, 20000); }) // safety net if the ready call never comes
      .catch(function (m) { showErr(String(m)); });
  };
  script.onerror = function () { showErr("Could not load the game. Check your connection and reload."); };
  document.body.appendChild(script);
</script>
</body>
</html>
